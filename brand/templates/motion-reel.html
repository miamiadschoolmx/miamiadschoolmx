<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MAS — Reel / Story animado (plantilla)</title>
<link rel="stylesheet" href="../web/mas.css">
<style>
  /* Motion 1080×1920 · 7.5 s. Render: node brand/scripts/render.mjs brand/templates/motion-reel.html --mp4
     Todas las animaciones son CSS @keyframes con animation-delay ABSOLUTO (segundos desde el inicio):
     el renderer congela la línea de tiempo y avanza cuadro por cuadro. fill-mode: both siempre.
     Principios de motion MAS: el M-dot está vivo (entra con escala y rebote) pero NUNCA se rota, deforma,
     contornea ni lleva efectos (manual p.19). El dot cae y rebota por separado sin deformarse (sigue siendo
     círculo). El tipo sube por líneas. Cortes secos / wipes entre escenas, como en un beat. */
  .scene { position: absolute; inset: 0; background: var(--bg); }
  .s2 { animation: wipe .45s cubic-bezier(.7,0,.2,1) 2.7s both; }
  .s3 { animation: wipe .45s cubic-bezier(.7,0,.2,1) 5.2s both; }
  @keyframes wipe { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }

  .story .head { position: absolute; left: var(--pad); right: var(--pad); bottom: 380px; }
  .ln { display: block; width: max-content; overflow: hidden; padding: .06em 0 .2em; margin: -.06em 0 -.2em; }
  .ln > span { display: block; animation: rise .7s cubic-bezier(.2,.9,.2,1) both; animation-delay: var(--d); }
  @keyframes rise { from { transform: translateY(160%); } to { transform: none; } }

  .mwrap { position: absolute; left: 40px; right: 40px; top: 210px; height: 900px; }
  .mwrap mas-mdot { position: absolute; inset: 0; transform-origin: 50% 60%; }
  .s1 mas-mdot { animation: pop .9s cubic-bezier(.3,1.45,.45,1) .15s both; }
  .s1 .mwrap { animation: drift 2.6s ease-in-out .9s both; transform-origin: 50% 60%; }
  .s2 mas-mdot { animation: slide .8s cubic-bezier(.2,1.2,.4,1) 2.85s both; }
  @keyframes pop   { from { transform: scale(.25); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
  @keyframes drift { from { transform: none; } to { transform: translateY(-14px) scale(1.025); } }
  @keyframes slide { from { transform: translateX(75%); } to { transform: none; } }

  /* El dot rebota por separado (circle.dot dentro del SVG). */
  mas-mdot .dot, mas-lockup .dot { transform-box: fill-box; transform-origin: 50% 50%; }
  .s1 mas-mdot .dot { animation: drop 1s linear .55s both; }
  .s2 mas-mdot .dot { animation: drop 1s linear 3.25s both; }
  .s3 mas-lockup .dot { animation: drop 1s linear 5.85s both; }
  @keyframes drop {
    0%   { transform: translateY(-1400%); animation-timing-function: cubic-bezier(.5,0,1,.6); }
    45%  { transform: translateY(0); animation-timing-function: cubic-bezier(0,.4,.5,1); }
    62%  { transform: translateY(-70%); animation-timing-function: cubic-bezier(.5,0,1,.6); }
    78%  { transform: translateY(0); animation-timing-function: cubic-bezier(0,.4,.5,1); }
    88%  { transform: translateY(-15%); }
    100% { transform: none; }
  }

  .s3 mas-lockup { position: absolute; left: 50%; top: 50%; width: 760px; height: 370px; translate: -50% -50%;
                   animation: settle .7s cubic-bezier(.3,1.4,.5,1) 5.45s both; }
  @keyframes settle { from { transform: scale(.82); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>

<section class="page story" data-duration="7.5" style="--bg: var(--pink-2040)">
  <div class="scene s1" style="--bg: var(--pink-2040)">
    <div class="mwrap"><mas-mdot v="14" m="black" dot="yellow-7548"></mas-mdot></div>
    <h1 class="h head" data-fit style="color: var(--pink-176)">
      <span class="ln"><span style="--d: 1.0s">Deja de</span></span>
      <span class="ln"><span style="--d: 1.12s">esperar tu</span></span>
      <span class="ln"><span style="--d: 1.24s">oportunidad.</span></span>
    </h1>
  </div>

  <div class="scene s2" style="--bg: var(--pink-2425)">
    <div class="mwrap"><mas-mdot v="23" m="black" dot="sky-2717"></mas-mdot></div>
    <h1 class="h head" data-fit style="color: var(--pink-238)">
      <span class="ln"><span style="--d: 3.35s">Empieza</span></span>
      <span class="ln"><span style="--d: 3.47s">a construirla.</span></span>
    </h1>
  </div>

  <div class="scene s3" style="--bg: var(--pink-176)">
    <mas-lockup m="pink-2040" dot="orange-1495" text="pink-2040"></mas-lockup>
  </div>
</section>

<script src="../web/mas-data.js"></script>
<script src="../web/mas.js"></script>
</body>
</html>
